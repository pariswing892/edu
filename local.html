-size:14px;color:#61708a;min-height:22px;margin-top:9px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.rank{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #e4e9f5;gap:10px}.rank strong{display:block}.rank small{font-size:13px;color:#5e6a81}.score{font-size:26px;font-weight:900;color:#275cff}.explain{padding:18px;background:#e7f8ec;border-radius:16px;margin:20px 0;font-size:18px;line-height:1.6}.names{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:15px 0 8px}input,select{padding:12px;border:2px solid #dce5ff;border-radius:12px;max-width:100%;width:100%;background:white;color:#182747}.small{font-size:14px;color:#5d6c86}.bar{height:7px;background:#e7edfc;border-radius:10px;margin:16px 0;overflow:hidden}.bar span{display:block;height:100%;background:#ffbb34}.win{font-size:60px;text-align:center}.board{display:grid;grid-template-columns:repeat(5,18px);gap:7px;background:#192c4e;padding:20px;border-radius:18px;width:max-content;margin:15px 0}.led{height:18px;background:#ff5775;border-radius:4px;box-shadow:0 0 7px #ff5775}.off{background:#334766;box-shadow:none}.blocks{display:flex;flex-direction:column;align-items:flex-start;margin:15px 0;font-weight:bold}.block{padding:10px 18px;background:#2675d5;color:white;border-radius:7px;border-bottom:3px solid white}.block:first-child{background:#bd4dce}.block b{background:#d94e80;padding:5px;border-radius:6px}footer{text-align:center;padding:10px;font-size:14px;color:#62708a}@media(max-width:900px){.layout{grid-template-columns:1fr;padding:0 15px 25px}header{padding:20px 16px}.panel{padding:20px}h1{font-size:30px}.options,.teams{grid-template-columns:1fr 1fr}.option{font-size:17px;padding:12px}}@media(max-width:520px){.options,.teams,.names{grid-template-columns:1fr}.clock{font-size:25px}.logo{font-size:18px}.tag{display:none}}
</style><header><div class="logo">⚡ micro:bit 感應器挑戰賽</div><div><button class="secondary" onclick="full()">全螢幕</button></div></header><div id="app"></div><footer>Lesson 3 · 觀察光線感應值 · 先討論，再作答！</footer><script>
const Q=[
['光線偵探','micro:bit 用哪個部分感測光線？',['LED 面板','按鈕 A','USB 插口','喇叭'],0,'LED 面板既可顯示內容，也可感測環境的光暗度。','led'],
['讀數密碼','光線感應值的範圍是甚麼？',['0 至 100','1 至 10','0 至 255','0 至 1000'],2,'0 表示最暗，255 表示最光。'],
['光暗實驗','用手遮住 LED 面板，光線讀數通常會怎樣？',['變大','變小','一定變成 255','變成文字'],1,'遮住面板後，接收到的光減少，讀數通常會變小。'],
['光暗實驗','把 micro:bit 移到較光亮的位置，讀數通常會怎樣？',['變小','保持不變','變成溫度','變大'],3,'環境愈光亮，光線感應值通常愈大。'],
['積木配對','為甚麼「光線感應值」可放進「顯示數字」？',['它傳回數字','它傳回圖示','它傳回文字','它是一個按鈕'],0,'「顯示數字」接收數字，而「光線感應值」傳回的也是數字。','blocks'],
['時間換算','暫停 1 秒，相等於多少毫秒？',['10 毫秒','100 毫秒','1000 毫秒','10000 毫秒'],2,'1 秒 = 1000 毫秒。課堂程式把暫停時間改為 1 second。'],
['程式偵探','按按鈕 A 後，正確的執行次序是？',['清除 → 暫停 → 顯示','顯示 → 暫停 → 清除','暫停 → 清除 → 顯示','顯示 → 清除 → 暫停'],1,'先顯示光線讀數，再暫停 1 秒，最後清除屏幕。','blocks'],
['算法結構','依次執行「顯示、暫停、清除」，屬於哪種結構？',['選擇結構','循環結構','隨機結構','序列結構'],3,'序列結構會按次序執行指令。'],
['讀數推理','三次讀數為 20、134、230，哪次環境最光亮？',['20','134','230','三次一樣'],2,'光線讀數愈大，環境通常愈光亮，所以是 230。'],
['屏幕觀察','顯示讀數 134 時，數字會怎樣顯示？',['向左滾動','全部同時固定顯示','向右滾動','只顯示 1'],0,'數值會向左滾動。顯示最後一位數後，再暫停和清除屏幕。'],
['感應器換裝','把程式改成顯示溫度，應替換哪個積木？',['按鈕 A','光線感應值','暫停','清除屏幕'],1,'將「光線感應值」換成「溫度」積木，再按課堂要求改為按鈕 B 觸發。'],
['冷熱實驗','環境變熱時，溫度感應值通常會怎樣？',['變小','變成 0','變成光線值','變大'],3,'溫度升高時，溫度感應值通常會變大；較冷時則變小。']
];let teams=[],round=0,phase='setup',start=0,elapsed=0,pauseAt=0,paused=false,results=[],history=[];const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setup(){phase='setup';app.innerHTML=`<div class="layout"><section class="panel"><div class="eyebrow">小組合作 · 12 道挑戰</div><h1>準備好成為<br>感應器小隊了嗎？</h1><p>老師投影題目，各組一起討論。老師按「開始計時」後，按各組的 A、B、C、D 記錄答案及秒數。全部提交後一起揭曉！</p><label for="count">小組數目</label><select id="count" onchange="names()">${[2,3,4,5,6,7,8].map(n=>`<option ${n===4?'selected':''}>${n}</option>`).join('')}</select><div class="names" id="names"></div><div class="actions"><button onclick="begin()">進入挑戰</button></div><p class="small">共用一部電腦，由老師記錄答案。沒有跨裝置同步；比賽期間請保留此頁。</p></section><aside class="panel"><h2>🏆 比賽規則</h2><p>答對：<strong>100 分</strong><br>答錯／未答：<strong>0 分</strong></p><p>總分相同時，答對題目的總用時較少者優先。兩項相同則並列。</p><p>計時從每題開始起算，至老師提交該組答案為止。老師可暫停，所有小組一起停錶。</p><p class="small">每題揭曉後可查看解說，最後可下載答題紀錄。</p></aside></div>`;names()}
function names(){document.querySelector('#names').innerHTML=Array.from({length:+document.querySelector('#count').value},(_,i)=>`<div><label for="n${i}">第 ${i+1} 組</label><input id="n${i}" maxlength="20" value="第 ${i+1} 組"></div>`).join('')}
function begin(){teams=Array.from(document.querySelectorAll('#names input'),x=>({name:x.value.trim()||'小組',score:0,time:0,correct:0}));round=0;history=[];prepare()}
function prepare(){phase='ready';results=teams.map(()=>null);elapsed=0;paused=false;render()}
function currentTime(){return phase==='live'?(paused?pauseAt-start:performance.now()-start)/1000:elapsed}
function go(){start=performance.now();phase='live';render()}
function pause(){if(phase!=='live')return;if(paused){start+=performance.now()-pauseAt;paused=false}else{pauseAt=performance.now();paused=true}render()}
function submit(i,a){if(phase!=='live'||paused||results[i])return;results[i]={answer:a,time:currentTime()};if(results.every(Boolean))reveal();else render()}
function reveal(){if(phase!=='live')return;elapsed=currentTime();phase='review';const q=Q[round];results=results.map(r=>r||{answer:-1,time:null});results.forEach((r,i)=>{r.correct=r.answer===q[3];if(r.correct){teams[i].score+=100;teams[i].correct++;teams[i].time+=r.time}history.push({question:round+1,team:teams[i].name,answer:r.answer<0?'未答':'ABCD'[r.answer],correct:r.correct,time:r.time})});render()}
function next(){round++;if(round===Q.length){phase='done';render()}else prepare()}
function rank(){let list=teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score||a.time-b.time);let rank=1;return list.map((t,i)=>{if(i&&!(t.score===list[i-1].score&&Math.abs(t.time-list[i-1].time)<.000001))rank=i+1;return `<div class="rank"><div><strong>${rank===1?'🥇':rank+'.'} ${esc(t.name)}</strong><small>答對 ${t.correct} 題 · ${t.time.toFixed(1)} 秒</small></div><div class="score">${t.score}</div></div>`}).join('')}
function visual(q){if(q[5]==='led')return `<div class="board" aria-label="5 乘 5 LED 面板示意">${Array.from({length:25},(_,i)=>`<span class="led ${[0,4,5,9,20,24].includes(i)?'off':''}"></span>`).join('')}</div>`;if(q[5]==='blocks')return '<div class="blocks" aria-label="課堂程式示意"><div class="block">當按鈕 A 被按下</div><div class="block">顯示數字 <b>光線感應值</b></div><div class="block">暫停（毫秒）1000</div><div class="block">清除屏幕</div></div>';return ''}
function render(){if(phase==='done'){app.innerHTML=`<div class="layout"><section class="panel"><div class="win">🏆</div><h1>挑戰完成！</h1><p>一起為每組的合作和努力鼓掌！</p>${rank()}<div class="actions"><button onclick="download()">下載答題紀錄 CSV</button><button class="secondary" onclick="setup()">新一場比賽</button></div></section><aside class="panel"><h2>今日學會了</h2><p>光線讀數：0 至 255</p><p>愈光亮，讀數愈大。</p><p>1 秒 = 1000 毫秒</p><p>序列：顯示、暫停、清除。</p><p>溫度升高，溫度讀數通常也升高。</p></aside></div>`;return}let q=Q[round];app.innerHTML=`<div class="layout"><main><section class="panel"><div class="topline"><div class="eyebrow">第 ${round+1} / ${Q.length} 題 · ${q[0]}</div><div class="clock" id="clock">${currentTime().toFixed(1)} 秒</div></div><div class="bar"><span style="width:${round/Q.length*100}%"></span></div><h1>${q[1]}</h1>${visual(q)}<div class="options">${q[2].map((a,i)=>`<div class="option" ${phase==='review'&&i===q[3]?'style="background:#dcf8e6;border-color:#2c9e62"':''}><span class="letter">${'ABCD'[i]}</span>${a}</div>`).join('')}</div>${phase==='review'?`<div class="explain" role="status">✅ 正確答案：${'ABCD'[q[3]]}<br>${q[4]}</div>`:''}<div class="actions">${phase==='ready'?'<button onclick="go()">▶ 開始計時</button>':phase==='live'?`<button class="secondary" onclick="pause()">${paused?'▶ 繼續計時':'⏸ 暫停討論'}</button><button class="secondary" onclick="if(confirm(\'結束本題並揭曉？未作答小組本題得 0 分。\'))reveal()">結束本題並揭曉</button>`:`<button onclick="next()">${round===Q.length-1?'查看最終結果':'下一題'}</button>`}</div><p class="small">${phase==='ready'?'開始前讓各組準備好，按開始才會計時。':paused?'計時已暫停，暫時不能提交答案。':phase==='live'?'各組答案提交後鎖定；全部作答後自動揭曉。':'綠色選項是正確答案。一起看看原因！'}</p></section><h2 style="margin:26px 0 14px">🙌 小組作答區</h2><div class="teams">${teams.map((t,i)=>`<div class="team"><h3>${esc(t.name)}</h3><div class="answers">${'ABCD'.split('').map((a,j)=>`<button aria-label="${esc(t.name)} 選擇 ${a}" onclick="submit(${i},${j})" ${phase!=='live'||paused||results[i]?'disabled':''}>${a}</button>`).join('')}</div><div class="status">${results[i]?phase==='review'?`${results[i].correct?'✅ 答對 +100':'💡 '+(results[i].answer===-1?'未作答':'再接再厲')} · ${results[i].time===null?'—':results[i].time.toFixed(1)+' 秒'}`:'🔒 已提交 · '+results[i].time.toFixed(1)+' 秒':'等待作答'}</div></div>`).join('')}</div></main><aside class="panel" style="align-self:start"><h2>🏆 即時排行榜</h2>${rank()}<p class="small">按總分排名，同分比較答對題目的總用時。</p><button class="secondary" onclick="if(confirm('放棄本場紀錄並重新設定？'))setup()">重新設定</button></aside></div>`}
function download(){let rows=[['題號','小組','答案','答對','答題秒數'],...history.map(r=>[r.question,r.team,r.answer,r.correct?'是':'否',r.time===null?'':r.time.toFixed(3)])];let csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='microbit-答題紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function full(){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})}
setInterval(()=>{let c=document.querySelector('#clock');if(c&&phase==='live')c.textContent=currentTime().toFixed(1)+' 秒'},100);setup();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'get_quiz_standings',description:'Read current quiz phase and group scores without changing the game.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||Object.keys(input).length)throw Error('No parameters accepted');return {phase,question:round+1,teams:teams.map(t=>({name:t.name,score:t.score,correct:t.correct,seconds:t.time}))}}})).catch(()=>{})}catch{}}
</script></html>
